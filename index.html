<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saif - Personal AI Assistant</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 420px; height: 95vh; background: #fff; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: #007bff; color: white; padding: 16px; text-align: center; font-weight: 600; font-size: 1.1rem; letter-spacing: 0.5px; }
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 0.95rem; line-height: 1.4; }
        .user { align-self: flex-end; background: #007bff; color: white; border-bottom-right-radius: 4px; }
        .bot { align-self: flex-start; background: #f1f3f4; color: #202124; border-bottom-left-radius: 4px; }
        .input-area { display: flex; padding: 12px; border-top: 1px solid #eee; background: #fff; }
        input { flex: 1; padding: 12px 16px; border: 1px solid #dadce0; border-radius: 24px; outline: none; font-size: 0.95rem; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; margin-left: 8px; border-radius: 24px; cursor: pointer; font-weight: 600; }
        button:hover { background: #0056b3; }
        .footer-copyright { font-size: 0.75rem; text-align: center; color: #70757a; padding: 6px; background: #fafafa; border-top: 1px solid #f0f0f0; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">Saif (AI Assistant)</div>
    <div class="chat-box" id="chatBox">
        <div class="message bot">Hi, ami saif, bolo kivabe help korte pari?</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="আপনার প্রশ্ন লিখুন..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
    </div>
    <div class="footer-copyright">
        © 2026 Saif AI • All Rights Reserved
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
